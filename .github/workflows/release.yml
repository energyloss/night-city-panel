name: Release checks

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: test -f Dashboard.qml && test -f packaging/manifest.json
      - name: Build provisional artifact
        run: sh scripts/package.sh
      - name: Upload provisional artifact
        uses: actions/upload-artifact@v4
        with:
          name: night-city-panel
          path: dist/*
